[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "n8n-mcp-server"
version = "0.1.0"
description = "MCP Server für selbst gehostetes n8n (Workflow-Management)"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
n8n-mcp-server = "n8n_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/n8n_mcp_server"]
